name: Quarterly Greek recipe catalog refresh

'on':
  schedule:
    # One provider per day limits operational blast radius and makes billed
    # three-projection write volume attributable per publisher.
    - cron: "0 3 1 1,4,7,10 *"
    - cron: "0 3 2 1,4,7,10 *"
    - cron: "0 3 3 1,4,7,10 *"
  workflow_dispatch: {}

concurrency:
  group: spoon-quarterly-catalog-refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  manual_validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Manual crawl and validation (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: akis
            label: Akis
          - source: argiro
            label: Argiro
          - source: gastronomos
            label: Gastronomos

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/recipe_importer/requirements.lock

      - name: Install importer dependencies
        run: python -m pip install --require-hashes -r tools/recipe_importer/requirements.lock

      - name: Test the catalog pipeline
        run: python -m pytest tools/recipe_importer/tests

      - name: Crawl the complete authorized Akis catalog
        if: matrix.source == 'akis'
        run: python tools/recipe_importer/crawl_catalog.py --i-have-permission

      - name: Crawl the complete authorized Argiro catalog
        if: matrix.source == 'argiro'
        run: python tools/recipe_importer/crawl_argiro.py --i-have-argiro-permission

      - name: Crawl the complete authorized Gastronomos catalog
        if: matrix.source == 'gastronomos'
        run: python tools/recipe_importer/crawl_gastronomos.py --i-have-gastronomos-permission

      - name: Validate Akis catalog and completeness manifest
        if: matrix.source == 'akis'
        run: >-
          python tools/recipe_importer/import_catalog.py
          tools/recipe_importer/output/akis-greek-full.jsonl
          --manifest tools/recipe_importer/output/akis-greek-full.manifest.json
          --i-have-permission

      - name: Validate Argiro catalog and completeness manifest
        if: matrix.source == 'argiro'
        run: >-
          python tools/recipe_importer/import_catalog.py
          tools/recipe_importer/output/argiro-greek-full.jsonl
          --manifest tools/recipe_importer/output/argiro-greek-full.manifest.json
          --i-have-permission
          --i-have-argiro-permission

      - name: Validate Gastronomos catalog and completeness manifest
        if: matrix.source == 'gastronomos'
        run: >-
          python tools/recipe_importer/import_catalog.py
          tools/recipe_importer/output/gastronomos-greek-full.jsonl
          --manifest tools/recipe_importer/output/gastronomos-greek-full.manifest.json
          --i-have-permission
          --i-have-gastronomos-permission

      - name: Upload audit reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manual-catalog-audit-${{ matrix.source }}-${{ github.run_id }}
          path: |
            tools/recipe_importer/output/${{ matrix.source }}-greek-full.manifest.json
            tools/recipe_importer/output/${{ matrix.source }}-greek-full.failures.json
          if-no-files-found: ignore
          retention-days: 30

  scheduled_refresh:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    name: Scheduled crawl, validation, and import
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: recipe-catalog-production
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/recipe_importer/requirements.lock

      - name: Install importer dependencies
        run: python -m pip install --require-hashes -r tools/recipe_importer/requirements.lock

      - name: Test the catalog pipeline
        run: python -m pytest tools/recipe_importer/tests

      - name: Verify deployment settings
        shell: bash
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo "Missing FIREBASE_PROJECT_ID environment variable" >&2; exit 1; }
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || { echo "Missing GCP_WORKLOAD_IDENTITY_PROVIDER environment variable" >&2; exit 1; }
          test -n "$GCP_SERVICE_ACCOUNT" || { echo "Missing GCP_SERVICE_ACCOUNT environment variable" >&2; exit 1; }

      - name: Crawl the complete authorized Akis catalog
        if: github.event.schedule == '0 3 1 1,4,7,10 *'
        run: python tools/recipe_importer/crawl_catalog.py --i-have-permission

      - name: Crawl the complete authorized Argiro catalog
        if: github.event.schedule == '0 3 2 1,4,7,10 *'
        run: python tools/recipe_importer/crawl_argiro.py --i-have-argiro-permission

      - name: Crawl the complete authorized Gastronomos catalog
        if: github.event.schedule == '0 3 3 1,4,7,10 *'
        run: python tools/recipe_importer/crawl_gastronomos.py --i-have-gastronomos-permission

      - name: Validate Akis catalog and completeness manifest
        if: github.event.schedule == '0 3 1 1,4,7,10 *'
        run: >-
          python tools/recipe_importer/import_catalog.py
          tools/recipe_importer/output/akis-greek-full.jsonl
          --manifest tools/recipe_importer/output/akis-greek-full.manifest.json
          --i-have-permission

      - name: Validate Argiro catalog and completeness manifest
        if: github.event.schedule == '0 3 2 1,4,7,10 *'
        run: >-
          python tools/recipe_importer/import_catalog.py
          tools/recipe_importer/output/argiro-greek-full.jsonl
          --manifest tools/recipe_importer/output/argiro-greek-full.manifest.json
          --i-have-permission
          --i-have-argiro-permission

      - name: Validate Gastronomos catalog and completeness manifest
        if: github.event.schedule == '0 3 3 1,4,7,10 *'
        run: >-
          python tools/recipe_importer/import_catalog.py
          tools/recipe_importer/output/gastronomos-greek-full.jsonl
          --manifest tools/recipe_importer/output/gastronomos-greek-full.manifest.json
          --i-have-permission
          --i-have-gastronomos-permission

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Import the validated Akis catalog
        if: github.event.schedule == '0 3 1 1,4,7,10 *'
        run: >-
          python tools/recipe_importer/import_catalog.py
          tools/recipe_importer/output/akis-greek-full.jsonl
          --manifest tools/recipe_importer/output/akis-greek-full.manifest.json
          --i-have-permission
          --commit
          --project-id "$FIREBASE_PROJECT_ID"

      - name: Import the validated Argiro catalog
        if: github.event.schedule == '0 3 2 1,4,7,10 *'
        run: >-
          python tools/recipe_importer/import_catalog.py
          tools/recipe_importer/output/argiro-greek-full.jsonl
          --manifest tools/recipe_importer/output/argiro-greek-full.manifest.json
          --i-have-permission
          --i-have-argiro-permission
          --commit
          --project-id "$FIREBASE_PROJECT_ID"

      - name: Import the validated Gastronomos catalog
        if: github.event.schedule == '0 3 3 1,4,7,10 *'
        run: >-
          python tools/recipe_importer/import_catalog.py
          tools/recipe_importer/output/gastronomos-greek-full.jsonl
          --manifest tools/recipe_importer/output/gastronomos-greek-full.manifest.json
          --i-have-permission
          --i-have-gastronomos-permission
          --commit
          --project-id "$FIREBASE_PROJECT_ID"

      - name: Upload audit reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduled-catalog-audit-${{ github.run_id }}
          path: |
            tools/recipe_importer/output/*.manifest.json
            tools/recipe_importer/output/*.failures.json
          if-no-files-found: ignore
          retention-days: 30

name: Quarterly Greek recipe catalog refresh

'on':
  schedule:
    # GitHub cron is UTC: 03:00 on the first day of Jan/Apr/Jul/Oct.
    - cron: "0 3 1 1,4,7,10 *"
  workflow_dispatch: {}

concurrency:
  group: spoon-quarterly-catalog-refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CATALOG_PATH: tools/recipe_importer/output/akis-greek-full.jsonl
  MANIFEST_PATH: tools/recipe_importer/output/akis-greek-full.manifest.json

jobs:
  manual_validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Manual crawl and validation
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/recipe_importer/requirements.lock

      - name: Install importer dependencies
        run: python -m pip install --require-hashes -r tools/recipe_importer/requirements.lock

      - name: Test the catalog pipeline
        run: python -m pytest tools/recipe_importer/tests

      - name: Crawl the complete authorized Greek catalog
        run: python tools/recipe_importer/crawl_catalog.py --i-have-permission

      - name: Validate catalog and completeness manifest
        run: >-
          python tools/recipe_importer/import_catalog.py "$CATALOG_PATH"
          --manifest "$MANIFEST_PATH"
          --i-have-permission

      - name: Upload audit reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manual-catalog-audit-${{ github.run_id }}
          path: |
            tools/recipe_importer/output/*.manifest.json
            tools/recipe_importer/output/*.failures.json
          if-no-files-found: ignore
          retention-days: 30

  scheduled_refresh:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    name: Scheduled crawl, validation, and import
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: recipe-catalog-production
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/recipe_importer/requirements.lock

      - name: Install importer dependencies
        run: python -m pip install --require-hashes -r tools/recipe_importer/requirements.lock

      - name: Test the catalog pipeline
        run: python -m pytest tools/recipe_importer/tests

      - name: Verify deployment settings
        shell: bash
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo "Missing FIREBASE_PROJECT_ID environment variable" >&2; exit 1; }
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || { echo "Missing GCP_WORKLOAD_IDENTITY_PROVIDER environment variable" >&2; exit 1; }
          test -n "$GCP_SERVICE_ACCOUNT" || { echo "Missing GCP_SERVICE_ACCOUNT environment variable" >&2; exit 1; }

      - name: Crawl the complete authorized Greek catalog
        run: python tools/recipe_importer/crawl_catalog.py --i-have-permission

      - name: Validate catalog and completeness manifest
        run: >-
          python tools/recipe_importer/import_catalog.py "$CATALOG_PATH"
          --manifest "$MANIFEST_PATH"
          --i-have-permission

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Import the validated catalog
        run: >-
          python tools/recipe_importer/import_catalog.py "$CATALOG_PATH"
          --manifest "$MANIFEST_PATH"
          --i-have-permission
          --commit
          --project-id "$FIREBASE_PROJECT_ID"

      - name: Upload audit reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduled-catalog-audit-${{ github.run_id }}
          path: |
            tools/recipe_importer/output/*.manifest.json
            tools/recipe_importer/output/*.failures.json
          if-no-files-found: ignore
          retention-days: 30
